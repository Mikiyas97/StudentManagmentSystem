<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student - Student Management System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">S</div>
          <div>
            <div class="logo-text">SMS</div>
            <div class="logo-subtitle">Student Management</div>
          </div>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main Menu</div>
          <a href="dashboard.html" class="nav-link">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            Dashboard
          </a>
          <a href="students.html" class="nav-link">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            Students
          </a>
          <a href="add-student.html" class="nav-link active">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
            Add Student
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">AD</div>
          <div class="user-details">
            <div class="user-name">Admin User</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">Add New Student</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-actions">
            <button class="icon-btn" title="Notifications">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
              <span class="badge"></span>
            </button>
            <button class="icon-btn" title="Settings">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area">
        <!-- Form Card -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Student Information</h2>
          </div>
          <div class="card-body">
            <form>
              <!-- Personal Information Section -->
              <div class="mb-4">
                <h3 style="font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: var(--spacing-lg);">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline; vertical-align: middle; margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                  Personal Details
                </h3>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label required" for="firstName">First Name</label>
                  <input type="text" id="firstName" class="form-input" placeholder="Enter first name">
                </div>
                <div class="form-group">
                  <label class="form-label required" for="lastName">Last Name</label>
                  <input type="text" id="lastName" class="form-input" placeholder="Enter last name">
                </div>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label required" for="email">Email Address</label>
                  <input type="email" id="email" class="form-input" placeholder="Enter email address">
                  <div class="form-hint">We'll never share your email with anyone else.</div>
                </div>
                <div class="form-group">
                  <label class="form-label required" for="phone">Phone Number</label>
                  <input type="tel" id="phone" class="form-input" placeholder="Enter phone number">
                </div>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label required" for="dob">Date of Birth</label>
                  <input type="date" id="dob" class="form-input">
                </div>
                <div class="form-group">
                  <label class="form-label required" for="gender">Gender</label>
                  <select id="gender" class="form-select">
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </div>

              <!-- Academic Information Section -->
              <div class="mb-4 mt-4" style="border-top: 1px solid var(--border-color); padding-top: var(--spacing-lg);">
                <h3 style="font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: var(--spacing-lg);">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline; vertical-align: middle; margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                  </svg>
                  Academic Details
                </h3>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label required" for="studentId">Student ID</label>
                  <input type="text" id="studentId" class="form-input" placeholder="Auto-generated" disabled>
                  <div class="form-hint">Student ID will be auto-generated upon submission.</div>
                </div>
                <div class="form-group">
                  <label class="form-label required" for="department">Department</label>
                  <select id="department" class="form-select">
                    <option value="">Select department</option>
                    <option value="cs">Computer Science</option>
                    <option value="eng">Engineering</option>
                    <option value="ba">Business Administration</option>
                    <option value="med">Medicine</option>
                    <option value="law">Law</option>
                    <option value="arts">Arts & Design</option>
                    <option value="sci">Natural Sciences</option>
                  </select>
                </div>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label required" for="year">Year of Study</label>
                  <select id="year" class="form-select">
                    <option value="">Select year</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                    <option value="5">Fifth Year</option>
                    <option value="6">Graduate</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="gpa">Current GPA</label>
                  <input type="text" id="gpa" class="form-input" placeholder="e.g., 3.75">
                </div>
              </div>

              <!-- Address Information Section -->
              <div class="mb-4 mt-4" style="border-top: 1px solid var(--border-color); padding-top: var(--spacing-lg);">
                <h3 style="font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: var(--spacing-lg);">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline; vertical-align: middle; margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>
                  Address Details
                </h3>
              </div>
              
              <div class="form-group">
                <label class="form-label" for="address">Street Address</label>
                <input type="text" id="address" class="form-input" placeholder="Enter street address">
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="city">City</label>
                  <input type="text" id="city" class="form-input" placeholder="Enter city">
                </div>
                <div class="form-group">
                  <label class="form-label" for="state">State/Province</label>
                  <input type="text" id="state" class="form-input" placeholder="Enter state">
                </div>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="zip">ZIP/Postal Code</label>
                  <input type="text" id="zip" class="form-input" placeholder="Enter ZIP code">
                </div>
                <div class="form-group">
                  <label class="form-label" for="country">Country</label>
                  <select id="country" class="form-select">
                    <option value="">Select country</option>
                    <option value="us">United States</option>
                    <option value="uk">United Kingdom</option>
                    <option value="ca">Canada</option>
                    <option value="au">Australia</option>
                    <option value="de">Germany</option>
                    <option value="fr">France</option>
                    <option value="jp">Japan</option>
                    <option value="in">India</option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </div>

              <!-- Form Actions -->
              <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                  </svg>
                  Add Student
                </button>
                <button type="reset" class="btn btn-secondary btn-lg">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                  </svg>
                  Reset Form
                </button>
                <a href="students.html" class="btn btn-ghost btn-lg">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
